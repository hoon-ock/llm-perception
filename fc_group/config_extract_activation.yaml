extraction:
  model_name: "meta-llama/Llama-3.1-8B"
  # Alternative models (see fc_group/model_registry.py for hidden_dim/num_layers
  # of each -- also overridable per-run via extract_activations_subset.py --model-name):
  # - "meta-llama/Meta-Llama-3.1-70B"
  # - "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
  # - "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
  # - "Qwen/Qwen3-8B"
  # - "Qwen/Qwen2.5-Math-7B"
  batch_size: 8
  aggregation: "last"
  save_dir: "fc_group/activation_datasets_functional_groups"

  quantization:
    load_in_4bit: false
    bnb_4bit_use_double_quant: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "float16"

  entities:
